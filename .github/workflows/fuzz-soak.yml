name: Fuzz Soak

# Nightly differential-fuzz soak: sweeps ONE fixed seed plus NINE fresh cryptographically-random
# seeds through test/oracle/fuzz_random.py (NumPy 2.4.2 oracle), generating 200K cases per seed by
# default and replaying them through the C# harness. The FuzzMatrix gate on every push/PR replays the
# small COMMITTED corpora (no Python); this job is the "millions of cases" tail that needs Python.
#
# Why 1 + 9: the generator is deterministic, so a fixed seed regenerates a byte-identical corpus every
# night. Five of them made half of each night's 2M cases the same inputs as the night before — through
# 13 nights (2026-09-11..23) in which master did not move at all. One fixed seed keeps both things a
# fixed seed is for: a deterministic canary (it turning red while the draw stayed put points at the
# code, not at new cases) and a corpus fingerprint comparable night to night (its source_sha256 in the
# evidence file should repeat while the generator and the NumPy pin are unchanged; a new value means
# NumPy answered differently on that runner). The nine others are drawn fresh every night, which is
# where the soak's new ground comes from. The split lives in the job env (SOAK_*_SEED_COUNT).
#
# On a divergence the harness prints a shrunk single-element repro (Shrinker) in the log and the
# offending corpus is uploaded as an artifact — copy the minimal line into
# test/NumSharp.Tests.Oracle/Fuzz/corpus/regressions/ so FuzzRegression pins it on every CI thereafter.
#
# Unlike those committed corpora (win-amd64 NumPy bytes), this job RECOMPUTES `expected` with the
# Linux NumPy of whatever runner it draws. So the oracle must not vary with the host: fuzz_random.py
# keeps host-defined values out of its operands (undefined float->integer casts; non-finite complex
# inputs to the ops NumPy hands to the platform's C99 complex library — see its comment blocks), and
# the job env below pins NumPy's CPU dispatch below AVX-512.
#
# Two more independent jobs (`random-api-lp64` + `random-api-soak`) replay the random-API oracle's families
# under 10 fresh seeds (see their comment), and `collections-stress`, at the end, runs the concurrent-collection
# storms at their golden budgets — the per-push CI runs them at the smaller CI budget (see that job's comment).

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC nightly
  workflow_dispatch:
    inputs:
      # Kept plural so existing `-f seeds=N` dispatches still bind; it now takes exactly one seed.
      seeds:
        description: 'The fixed seed: exactly one non-negative integer (nine fresh random seeds are added)'
        default: '1'
      count:
        description: 'Random cases per seed'
        default: '200000'
      random_api_seeds:
        description: 'Random-API soak: comma-separated seeds in [0, 2**32) to replay a night (empty: 10 fresh ones)'
        default: ''

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Pins the oracle's CPU dispatch below AVX-512, as build-and-release.yml does for interop-test's
    # ubuntu leg (full rationale there). Hosted ubuntu runners are a mix of AVX2-only and AVX-512
    # machines, and on AVX512_SKX hardware the Linux wheel leaves the reference configuration: it links
    # Intel SVML for float64 exp/log (__svml_exp8_ha/__svml_log8_ha) and ~20 more f32/f64 ufuncs, and
    # dispatches the AVX512F float32 exp/log kernels where NumSharp ports the AVX2-FMA3 ones. The
    # float32 exp/log/sin/cos cells are held BIT-EXACT (MisalignedRegistry's ported-kernel carve-out),
    # so they cannot ride a ULP excuse. Only the AVX2 dispatch is the reference answer: the win-amd64
    # wheel never compiles an AVX-512 variant. Disabling a feature the CPU lacks is a silent no-op, so
    # AVX2 runners are unaffected. "Install NumPy" logs the runner's raw ISA next to the effective dispatch.
    env:
      NPY_DISABLE_CPU_FEATURES: 'X86_V4 AVX512_ICL AVX512_SPR'
      # The seed split (header: why 1 + 9). Job env rather than script variables, so the random-seed
      # generator's Python heredoc reads SOAK_RANDOM_SEED_COUNT from the environment it already has.
      # Both must be positive integers, and the sweep step refuses anything else: bash arithmetic reads
      # a malformed value as 0, which would run the wrong shape silently. The `seeds` input description
      # spells these counts in words, so change the three together.
      SOAK_FIXED_SEED_COUNT: '1'
      SOAK_RANDOM_SEED_COUNT: '9'
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    # The raw per-instruction flags (AVX512F) survive the pin while the dispatch groups (X86_V4,
    # AVX512_ICL) do not, so "AVX512F=True ... X86_V4=False" is the pin at work on an AVX-512 runner.
    - name: Install NumPy 2.4.2 (the oracle)
      shell: bash
      run: |
        pip install "numpy==2.4.2"
        python -c "from numpy._core._multiarray_umath import __cpu_features__ as f; \
        print('cpu         ', 'AVX512F=%s AVX2=%s | numpy dispatch X86_V4=%s AVX512_ICL=%s' \
              % tuple(f.get(k) for k in ('AVX512F', 'AVX2', 'X86_V4', 'AVX512_ICL')))"

    - name: Soak — sweep seeds
      shell: bash
      run: |
        # Seed 1 is the one survivor of the former 1..5 set, so its nightly evidence stays comparable.
        FIXED_SEEDS="${{ github.event.inputs.seeds || '1' }}"
        COUNT="${{ github.event.inputs.count || '200000' }}"
        EVIDENCE="fuzz-soak-evidence.jsonl"
        CORPUS="test/NumSharp.Tests.Oracle/Fuzz/corpus/random_smoke.jsonl"
        COPIED_CORPUS="test/NumSharp.Tests.Oracle/bin/Release/net10.0/Fuzz/corpus/random_smoke.jsonl"
        STATUS=0

        : > "$EVIDENCE"
        # The split is configuration, not input, but the -ne tests below would read a malformed value
        # as 0 and accept the wrong shape, so it is validated before anything depends on it.
        for split in SOAK_FIXED_SEED_COUNT SOAK_RANDOM_SEED_COUNT; do
          if [[ ! "${!split}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::$split must be a positive integer, got: '${!split}'"
            exit 1
          fi
        done
        read -r -a fixed_seed_array <<< "$FIXED_SEEDS"
        if [[ ${#fixed_seed_array[@]} -ne $SOAK_FIXED_SEED_COUNT ]]; then
          echo "::error::Expected exactly $SOAK_FIXED_SEED_COUNT fixed seed(s), got ${#fixed_seed_array[@]}: $FIXED_SEEDS"
          exit 1
        fi
        if [[ ! "$COUNT" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::count must be a positive integer, got: $COUNT"
          exit 1
        fi

        declare -A seen_fixed=()
        for seed in "${fixed_seed_array[@]}"; do
          if [[ ! "$seed" =~ ^[0-9]+$ ]]; then
            echo "::error::Fixed seed must be a non-negative integer, got: $seed"
            exit 1
          fi
          if [[ -n "${seen_fixed[$seed]+present}" ]]; then
            echo "::error::Fixed seeds must be unique, duplicate: $seed"
            exit 1
          fi
          seen_fixed[$seed]=1
        done

        export FIXED_SEEDS
        mapfile -t random_seed_array < <(python - <<'PY'
        import os
        import secrets

        fixed = {int(seed) for seed in os.environ["FIXED_SEEDS"].split()}
        random_seeds = set()
        # Distinct, and never the fixed seed: a repeat would replay a corpus this run already covers.
        while len(random_seeds) < int(os.environ["SOAK_RANDOM_SEED_COUNT"]):
            seed = secrets.randbelow(2**63 - 1) + 1
            if seed not in fixed:
                random_seeds.add(seed)
        for seed in random_seeds:
            print(seed)
        PY
        )
        # mapfile over a process substitution drops the generator's exit status, so a crashed or
        # interrupted generator surfaces HERE, as a short count.
        if [[ ${#random_seed_array[@]} -ne $SOAK_RANDOM_SEED_COUNT ]]; then
          echo "::error::Expected $SOAK_RANDOM_SEED_COUNT random seeds, generated ${#random_seed_array[@]}"
          exit 1
        fi

        fixed_csv=$(IFS=,; echo "${fixed_seed_array[*]}")
        random_csv=$(IFS=,; echo "${random_seed_array[*]}")
        # From the seed lists rather than a literal, so the evidence stays true if the split changes.
        requested_total=$((COUNT * (${#fixed_seed_array[@]} + ${#random_seed_array[@]})))
        printf '{"record":"run","requested_cases_per_seed":%s,"requested_total_cases":%s,"fixed_seeds":[%s],"random_seeds":[%s]}\n' \
          "$COUNT" "$requested_total" "$fixed_csv" "$random_csv" >> "$EVIDENCE"
        echo "Fixed seeds:  ${fixed_seed_array[*]}"
        echo "Random seeds: ${random_seed_array[*]}"
        echo "Requested cases: $COUNT per seed, $requested_total total"

        run_seed() {
          local kind="$1"
          local seed="$2"
          local result="passed"
          local source_cases=0
          local copied_cases=0
          local source_sha=""
          local copied_sha=""
          local trx_name="fuzz-${kind}-seed-${seed}.trx"

          echo "::group::kind=$kind seed=$seed count=$COUNT"
          if ! python test/oracle/fuzz_random.py "$seed" "$COUNT" random_smoke.jsonl; then
            result="generation-failed"
          else
            source_cases=$(wc -l < "$CORPUS")
            source_sha=$(sha256sum "$CORPUS" | cut -d' ' -f1)
            if [[ "$source_cases" -ne "$COUNT" ]]; then
              echo "::error::Generator wrote $source_cases cases for seed=$seed; expected $COUNT"
              result="source-count-mismatch"
            elif ! dotnet build test/NumSharp.Tests.Oracle/NumSharp.Tests.Oracle.csproj \
                --configuration Release -p:NoWarn=CS1591 >/dev/null; then
              result="build-failed"
            elif [[ ! -f "$COPIED_CORPUS" ]]; then
              echo "::error::Regenerated corpus was not copied to the net10.0 test output"
              result="copied-corpus-missing"
            else
              copied_cases=$(wc -l < "$COPIED_CORPUS")
              copied_sha=$(sha256sum "$COPIED_CORPUS" | cut -d' ' -f1)
              if [[ "$copied_cases" -ne "$COUNT" || "$copied_sha" != "$source_sha" ]]; then
                echo "::error::Test-output corpus does not match the generated $COUNT-case corpus for seed=$seed"
                result="copied-corpus-mismatch"
              elif ! dotnet test test/NumSharp.Tests.Oracle/NumSharp.Tests.Oracle.csproj \
                  --configuration Release --no-build --framework net10.0 \
                  --filter "ClassName~FuzzCorpusTests&Name~FuzzRandom" \
                  --logger "trx;LogFileName=$trx_name"; then
                echo "::error::Fuzz soak found a divergence at seed=$seed (see the 'minimal repro' line above)"
                result="test-failed"
              fi
            fi
          fi

          if [[ "$result" != "passed" && -f "$CORPUS" ]]; then
            cp "$CORPUS" "failing-seed-$seed.jsonl"
          fi
          printf '{"record":"seed","kind":"%s","seed":%s,"requested_cases":%s,"source_cases":%s,"copied_cases":%s,"source_sha256":"%s","copied_sha256":"%s","result":"%s","trx":"%s"}\n' \
            "$kind" "$seed" "$COUNT" "$source_cases" "$copied_cases" "$source_sha" "$copied_sha" "$result" "$trx_name" >> "$EVIDENCE"
          echo "::endgroup::"
          [[ "$result" == "passed" ]]
        }

        for seed in "${fixed_seed_array[@]}"; do
          if ! run_seed fixed "$seed"; then STATUS=1; fi
        done
        for seed in "${random_seed_array[@]}"; do
          if ! run_seed random "$seed"; then STATUS=1; fi
        done
        exit $STATUS

    - name: Upload soak evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-soak-evidence
        path: |
          fuzz-soak-evidence.jsonl
          test/NumSharp.Tests.Oracle/TestResults/fuzz-*.trx
        if-no-files-found: warn
        retention-days: 14

    - name: Upload failing corpora
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-soak-failures
        path: failing-seed-*.jsonl
        retention-days: 14

  # ── The random-API oracle under 10 FRESH seeds ───────────────────────────────────────────────────
  #
  # The committed random_api*.jsonl tiers (docs/plans/random-oracle-coverage.md) replay every overload of the random
  # world — NumPyRandom, Generator, the five bit generators, their State classes, SeedSequence, default_rng — under
  # 10 FIXED seeds on every push. These two jobs regenerate the SAME families under 10 seeds drawn fresh every night
  # and replay them through the same harness, so a stream divergence that only some seeds reach still surfaces.
  #
  # Two jobs because the corpus needs two NumPys: the legacy integer samplers' answers that depend on C long being
  # 64-bit come from Linux NumPy (`random-api-lp64`, the generator's --lp64-only mode), and everything else — the
  # libm tier above all — is authored by win-amd64 NumPy (`random-api-soak`, which merges the Linux rows with
  # --lp64-rows, exactly as the committed corpus merges them from WSL). The replay binds NumPy's OWN scipy-openblas
  # (numpy.libs) for the multivariate-normal tier, whose bytes are reproducible only through that library.
  #
  # On a divergence the replay lists every failing case (id, NumPy's answer, NumSharp's), and the whole corpus plus
  # manifest.json (the seeds) is uploaded; `workflow_dispatch -f random_api_seeds=a,b,...` regenerates that night.
  random-api-lp64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      seeds: ${{ steps.seeds.outputs.seeds }}
    steps:
    - uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install NumPy 2.4.2 (the oracle)
      shell: bash
      run: pip install "numpy==2.4.2"

    # 10 distinct seeds in [0, 2**32) (the legacy RandomState(int) domain every family runs), none of them one of the
    # committed corpus's fixed seeds (those are replayed on every push already). A dispatch may pin them instead.
    - name: Draw the seeds
      id: seeds
      shell: bash
      env:
        PINNED: ${{ github.event.inputs.random_api_seeds }}
      run: |
        SEEDS=$(python - <<'PY'
        import os
        import secrets
        fixed = {0, 1, 7, 42, 1234, 65535, 2147483647, 2147483648, 987654321, 4294967295}
        pinned = os.environ.get("PINNED", "").strip()
        if pinned:
            seeds = [int(x) for x in pinned.split(",")]
            if len(set(seeds)) != len(seeds) or not all(0 <= x < 2 ** 32 for x in seeds):
                raise SystemExit(f"random_api_seeds must be distinct integers in [0, 2**32): {pinned}")
        else:
            drawn = set()
            while len(drawn) < 10:
                x = secrets.randbelow(2 ** 32)
                if x not in fixed:
                    drawn.add(x)
            seeds = sorted(drawn)
        print(",".join(str(x) for x in seeds))
        PY
        )
        if [[ -z "$SEEDS" ]]; then
          echo "::error::no seeds drawn"
          exit 1
        fi
        echo "Random-API soak seeds: $SEEDS"
        echo "seeds=$SEEDS" >> "$GITHUB_OUTPUT"

    - name: Linux NumPy's answers for the LP64 families
      shell: bash
      run: |
        python test/oracle/gen_random_oracle.py --lp64-only --seeds "${{ steps.seeds.outputs.seeds }}" --out random-api-lp64

    - name: Upload the LP64 rows
      uses: actions/upload-artifact@v7
      with:
        name: random-api-lp64-rows
        path: random-api-lp64/lp64_rows.jsonl
        if-no-files-found: error
        retention-days: 14

  random-api-soak:
    needs: random-api-lp64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install NumPy 2.4.2 (the oracle)
      shell: bash
      run: pip install "numpy==2.4.2"

    - name: Download the LP64 rows
      uses: actions/download-artifact@v8
      with:
        name: random-api-lp64-rows
        path: random-api-lp64

    - name: Generate the random-API corpus under the fresh seeds
      shell: bash
      run: |
        python test/oracle/gen_random_oracle.py --seeds "${{ needs.random-api-lp64.outputs.seeds }}" \
          --out random-api-soak --lp64-rows random-api-lp64/lp64_rows.jsonl
        cat random-api-soak/manifest.json

    - name: Build
      run: dotnet build test/NumSharp.Tests.Oracle/NumSharp.Tests.Oracle.csproj --configuration Release -p:NoWarn=CS1591

    # Both frameworks: the committed corpus showed one runtime-only divergence (.NET 8's double % NaN), so a
    # fresh-seed divergence could be runtime-specific too. NUMSHARP_OPENBLAS_LIBRARY binds NumPy's own
    # scipy-openblas (content-pinned; the mvn tier goes Inconclusive, not red, if it ever stops matching).
    - name: Replay (net10.0, net8.0)
      shell: bash
      run: |
        NUMSHARP_OPENBLAS_LIBRARY=$(python -c "import glob, os, numpy; d = os.path.join(os.path.dirname(os.path.dirname(numpy.__file__)), 'numpy.libs'); print(glob.glob(os.path.join(d, 'libscipy_openblas*.dll'))[0])")
        export NUMSHARP_OPENBLAS_LIBRARY
        export NUMSHARP_RANDOM_SOAK_DIR="$PWD/random-api-soak"
        echo "OpenBLAS: $NUMSHARP_OPENBLAS_LIBRARY"
        STATUS=0
        for tfm in net10.0 net8.0; do
          if ! dotnet test test/NumSharp.Tests.Oracle/NumSharp.Tests.Oracle.csproj \
              --configuration Release --no-build --framework "$tfm" \
              --filter "Name=RandomApiSoak" --logger "trx;LogFileName=random-api-soak-$tfm.trx" \
              --logger "console;verbosity=normal"; then
            echo "::error::The random-API soak diverged on $tfm (seeds: ${{ needs.random-api-lp64.outputs.seeds }})"
            STATUS=1
          fi
        done
        exit $STATUS

    - name: Upload soak evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: random-api-soak-evidence
        path: |
          random-api-soak/manifest.json
          test/NumSharp.Tests.Oracle/TestResults/random-api-soak-*.trx
        if-no-files-found: warn
        retention-days: 14

    - name: Upload the failing corpus
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: random-api-soak-corpus
        path: random-api-soak/
        retention-days: 14

  # ── The concurrent-collection storms at their GOLDEN budgets ─────────────────────────────────────
  #
  # test/NumSharp.Tests/Collections/StressBudget.cs gives every op-count storm two budgets: the one it was
  # authored with (the "golden" budget, sized to drain inside its 2-minute join ceiling) and a per-push CI
  # budget that shrinks the collection and trims the operation count but keeps every thread, operation mix
  # and assertion. At the golden budget those suites cost 99-124 s per target framework on the build-and-release
  # `test` legs (run 35892546210) — close to half of NumSharp.Tests — so per-push CI runs the CI budget and
  # THIS job runs the golden one, every night, so the deep storms keep their bite without taxing every push.
  #
  # One OS and one framework: the storms hammer the collections' own lock/fence protocol, which the JIT
  # emits the same way on both frameworks; the per-push legs already cover all three OSes and both
  # frameworks at the CI budget. No Python, no OpenBLAS — just the managed suite.
  collections-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUMSHARP_TEST_STRESS: full
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Build
      run: dotnet build test/NumSharp.Tests/NumSharp.Tests.csproj --configuration Release -p:NoWarn=CS1591

    - name: Collections storms at the golden budget (net10.0)
      shell: bash
      run: |
        dotnet test test/NumSharp.Tests/NumSharp.Tests.csproj \
          --configuration Release --no-build --framework net10.0 \
          --filter "FullyQualifiedName~NumSharp.Tests.Collections&TestCategory!=OpenBugs&TestCategory!=HighMemory" \
          --logger "trx;LogFileName=collections-stress.trx"

    - name: Upload stress results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: collections-stress-results
        path: test/NumSharp.Tests/TestResults/collections-stress.trx
        if-no-files-found: warn
        retention-days: 14
