name: Build and Release

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions: write-all

env:
  # Suppress noisy build warnings that clutter CI annotations.
  # Uses %3B (URL-encoded semicolon) because MSBuild CLI treats raw ; and , as property separators.
  # XML doc warnings (CS15xx, CS17xx): ~7,200 of ~8,700 total — malformed/missing doc comments
  # CS8981: 'np' only contains lowercase chars — intentional for NumPy API compat
  # NU5048: PackageIconUrl deprecated — cosmetic NuGet warning
  # NU5100/NU5128 are BY-DESIGN for the tools-only NumSharp.Build package (assemblies under
  # tools/, no lib/ per TFM) — a global -p:NoWarn OVERRIDES the csproj's own NoWarn accumulation,
  # so they must ride here like NU5048 does.
  DOTNET_NOWARN: CS1570%3BCS1571%3BCS1572%3BCS1573%3BCS1574%3BCS1587%3BCS1591%3BCS1711%3BCS1734%3BCS8981%3BNU5048%3BNU5100%3BNU5128

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    # ── Strong naming: the per-push gate (ubuntu leg only) ─────────────────────────────────────────
    #
    # This step and "Strong naming: pack (throwaway) and verify …" (after the test steps) were the
    # separate `verify-signing` job until 2026-09-23. The identical check also runs in build-nuget
    # below, but that job only exists on a tag push — and a release-only gate is how the original
    # defect survived six years: signing was configured in a `Publish` configuration nothing built,
    # so nothing ever evaluated it until someone looked at a shipped DLL. Checking on every push and
    # PR catches a regression in the PR that causes it rather than on release day, when the fix is a
    # re-tag.
    #
    # Why it rides on `test` instead of owning a job: that job took 69 s (run 35858283137) and ~45 s
    # of it repeated work this job already does — its own checkout (9 s), a cold .NET start (5 s) and
    # a from-scratch Release compile + NDScope weave of NumSharp.Core (~31 s). Here the Build steps
    # below have produced those outputs already, so the pack is incremental (see its comment).
    #
    # Why ubuntu only: build-nuget packs every release on ubuntu-latest, so this leg checks the
    # platform whose output ships; Directory.Build.props enables signing with no OS condition; and it
    # is the shortest leg (11.5 min against Windows' 15.7 in that run), so the ~20-25 s it adds does
    # not lengthen the run.
    #
    # The key is committed and marked `binary` in .gitattributes (without which `* text=auto eol=lf`
    # would rewrite CRLF bytes inside it and corrupt the key). Assert both facts before building, so
    # a checkout/attribute problem reports as itself instead of as a confusing signing failure.
    - name: "Strong naming: key is present and intact"
      id: snk
      if: matrix.os == 'ubuntu-latest'
      run: |
        test -f Open.snk || { echo "::error::Open.snk missing from checkout — signing cannot work."; exit 1; }
        SIZE=$(stat -c%s Open.snk)
        SHA=$(sha256sum Open.snk | cut -d' ' -f1)
        echo "Open.snk: $SIZE bytes, sha256 $SHA"
        [ "$SIZE" = "596" ] || { echo "::error::Open.snk is $SIZE bytes, expected 596 — likely line-ending corruption; check the '*.snk binary' rule in .gitattributes."; exit 1; }
        [ "$SHA" = "b897629e0b20090c9219ac80392c037fa4cfcc2bdc21d3c45d9bf74b8df0f671" ] || { echo "::error::Open.snk content changed."; exit 1; }

    - name: Build
      run: dotnet build test/NumSharp.Tests/NumSharp.Tests.csproj --configuration Release -p:NoWarn=${{ env.DOTNET_NOWARN }}

    # The differential-fuzz ORACLE is its own project (isolated so the optional OpenBLAS engine can be
    # managed apart from the managed-kernel tiers). It carries the FuzzMatrix gate plus the host-pinned
    # matmul_parity / BlasBackendDelta tiers, so it must build and test on the release-blocking path.
    - name: Build Oracle (differential-fuzz gate)
      run: dotnet build test/NumSharp.Tests.Oracle/NumSharp.Tests.Oracle.csproj --configuration Release -p:NoWarn=${{ env.DOTNET_NOWARN }}

    # The analyzer gate: NumSharp.Tests.Build.Analyzer runs the NDW012 leak analyzer + the NDW016/NDW017
    # type-level ownership analyzer + the [NDScoped]-target gate (NDW002/003/005/006/009/010/011/015)
    # in-process over the NumSharp.Tests.Build.Analyzer.Fixtures files and asserts the diagnostics land on
    # exactly the tagged lines.
    - name: Build Analyzer tests
      run: dotnet build test/NumSharp.Tests.Build.Analyzer/NumSharp.Tests.Build.Analyzer.csproj --configuration Release -p:NoWarn=${{ env.DOTNET_NOWARN }}

    # Test filtering:
    #   - OpenBugs: excluded (known-failing bug reproductions)
    #   - HighMemory: excluded (requires 8GB+ RAM, too much for CI runners)
    #   - WindowsOnly: excluded on non-Windows runners
    #   - FuzzMatrix: INCLUDED — the NumPy differential gate (cast/binary/comparison/unary/reduce/
    #     where/place matrices + the seeded FuzzRandom corpus + FuzzRegression). These replay the
    #     committed offline corpora under test/.../Fuzz/corpus/ and need no Python. The "millions of
    #     cases" tail (Python-generated) runs nightly in fuzz-soak.yml.
    - name: Test (net8.0)
      shell: bash
      timeout-minutes: 10
      run: |
        echo "Starting test run (net8.0)..."
        echo "dotnet version: $(dotnet --version)"
        echo "Available memory: $(free -h 2>/dev/null || echo 'N/A')"
        FILTER="TestCategory!=OpenBugs&TestCategory!=HighMemory"
        if [[ "$RUNNER_OS" != "Windows" ]]; then
          FILTER="$FILTER&TestCategory!=WindowsOnly"
        fi
        dotnet test test/NumSharp.Tests/NumSharp.Tests.csproj \
          --configuration Release --no-build --framework net8.0 \
          --filter "$FILTER" --logger "trx"

    - name: Test (net10.0)
      shell: bash
      timeout-minutes: 10
      run: |
        echo "Starting test run (net10.0)..."
        echo "dotnet version: $(dotnet --version)"
        echo "Available memory: $(free -h 2>/dev/null || echo 'N/A')"
        FILTER="TestCategory!=OpenBugs&TestCategory!=HighMemory"
        if [[ "$RUNNER_OS" != "Windows" ]]; then
          FILTER="$FILTER&TestCategory!=WindowsOnly"
        fi
        dotnet test test/NumSharp.Tests/NumSharp.Tests.csproj \
          --configuration Release --no-build --framework net10.0 \
          --filter "$FILTER" --logger "trx"

    # The differential-fuzz gate (FuzzMatrix) now lives in NumSharp.Tests.Oracle. Same category
    # filter — the Oracle project carries no OpenBugs/HighMemory tiers, but the filter is harmless and
    # keeps the two suites symmetric.
    - name: Test Oracle (net8.0)
      shell: bash
      timeout-minutes: 10
      run: |
        FILTER="TestCategory!=OpenBugs&TestCategory!=HighMemory"
        if [[ "$RUNNER_OS" != "Windows" ]]; then
          FILTER="$FILTER&TestCategory!=WindowsOnly"
        fi
        dotnet test test/NumSharp.Tests.Oracle/NumSharp.Tests.Oracle.csproj \
          --configuration Release --no-build --framework net8.0 \
          --filter "$FILTER" --logger "trx"

    - name: Test Oracle (net10.0)
      shell: bash
      timeout-minutes: 10
      run: |
        FILTER="TestCategory!=OpenBugs&TestCategory!=HighMemory"
        if [[ "$RUNNER_OS" != "Windows" ]]; then
          FILTER="$FILTER&TestCategory!=WindowsOnly"
        fi
        dotnet test test/NumSharp.Tests.Oracle/NumSharp.Tests.Oracle.csproj \
          --configuration Release --no-build --framework net10.0 \
          --filter "$FILTER" --logger "trx"

    # The analyzer gate. AnalyzerBuild is excluded: that one test spawns `dotnet build` to exercise the
    # MSBuild NDW013 warning (also covered by tools/verify_build_package.sh step 17); the in-process
    # Roslyn-analyzer assertions here are the cross-platform gate.
    - name: Test Analyzer (net8.0)
      shell: bash
      timeout-minutes: 10
      run: |
        dotnet test test/NumSharp.Tests.Build.Analyzer/NumSharp.Tests.Build.Analyzer.csproj \
          --configuration Release --no-build --framework net8.0 \
          --filter "TestCategory!=OpenBugs&TestCategory!=HighMemory&TestCategory!=AnalyzerBuild" --logger "trx"

    - name: Test Analyzer (net10.0)
      shell: bash
      timeout-minutes: 10
      run: |
        dotnet test test/NumSharp.Tests.Build.Analyzer/NumSharp.Tests.Build.Analyzer.csproj \
          --configuration Release --no-build --framework net10.0 \
          --filter "TestCategory!=OpenBugs&TestCategory!=HighMemory&TestCategory!=AnalyzerBuild" --logger "trx"

    # ── Strong naming: pack a THROWAWAY version and verify it (ubuntu leg only) ───────────────────
    #
    # Packs every shipping project into a scratch directory, then verify_strong_name.cs asserts that
    # every managed assembly in every .nupkg carries NumSharp's full public key and a real (not
    # delay-) signature. It inspects the PACKED artifact because that is what users install; a
    # compile gate cannot see "builds fine, ships with no identity". Publishes nothing.
    #
    # Why it is cheap here: the Build steps above already built NumSharp.Core (compiled, woven and
    # re-signed), NumSharp.Bitmap, NumSharp.Interop.OpenBLAS and NumSharp.Build in Release with the
    # SAME -p:NoWarn, so each `dotnet pack` is an incremental build — Core's CoreCompile and its
    # NDScopeWeave marker are up to date, so Core is neither recompiled nor re-woven, and only
    # pythonnet, OnnxRuntime and MLNet compile. Measured on a fresh clone pinned to 4 CPUs: 17 s for
    # the 7 packs + 1 s to verify, with no weave line from Core (the old standalone job's CI log put
    # its six non-Core packs at 14.5 s). If the Build steps' properties ever diverge from these, the
    # pack still verifies correctly; it just recompiles Core.
    #
    # Why it runs LAST with `!cancelled()`: its verdict stays independent of the tests, as the
    # separate job's was — a red test must not hide a signing regression, and a signing regression
    # must not skip the tests. It builds whatever it needs itself, so it does not require the Build
    # steps to have passed; it requires only the key check (`snk`), whose own failure already names
    # the root cause. A cancelled run still stops it (always() would not).
    - name: "Strong naming: pack (throwaway) and verify every shipped assembly is signed"
      if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && steps.snk.outcome == 'success' }}
      timeout-minutes: 10
      run: |
        mkdir -p artifacts/signing-check
        for proj in src/NumSharp.Core/NumSharp.Core.csproj \
                    src/NumSharp.Bitmap/NumSharp.Bitmap.csproj \
                    src/NumSharp.Interop.pythonnet/NumSharp.Interop.pythonnet.csproj \
                    src/NumSharp.Interop.OpenBLAS/NumSharp.Interop.OpenBLAS.csproj \
                    src/NumSharp.Interop.OnnxRuntime/NumSharp.Interop.OnnxRuntime.csproj \
                    src/NumSharp.Interop.MLNet/NumSharp.Interop.MLNet.csproj \
                    tools/NumSharp.Build/NumSharp.Build.csproj; do
          # Tolerate absence: the interop packages do not exist on every branch.
          [ -f "$proj" ] || { echo "skip (absent): $proj"; continue; }
          echo "::group::pack $proj"
          # A plain restore→build→pack. Nothing in the repo packs on build any more: the old
          # GeneratePackageOnBuild=true in every csproj re-packed on every dotnet build/test (for
          # the OpenBLAS package that re-zipped ~186 MB of runtimes each time) and, combined with
          # `dotnet pack` + multi-targeting, drew NU5026.
          dotnet pack "$proj" --configuration Release --output artifacts/signing-check \
            -p:NoWarn=${{ env.DOTNET_NOWARN }}
          echo "::endgroup::"
        done
        dotnet run .github/scripts/verify_strong_name.cs -- artifacts/signing-check

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-${{ matrix.os }}
        path: ${{ github.workspace }}/**/TestResults/**/*.trx
        retention-days: 5

  # ── Interop: every NumSharp.Interop.* bridge, one job per OS ─────────────────────────────────────
  #
  # This job gates all four interop packages, suite after suite:
  #   1. NumSharp.Interop.pythonnet  — NumSharp.Tests.Interop, run TWICE, each time embedding a
  #      different Python environment (see "Python environments" below).
  #   2. NumSharp.Interop.OnnxRuntime — its suite against the package's FLOOR ORT on both TFMs, then
  #      against the CURRENT ORT.
  #   3. NumSharp.Interop.MLNet      — the same, floor ML.NET then current.
  #   4. NumSharp.Interop.OpenBLAS   — the nupkg-CONSUMER gate ("Package consumer:" steps), LAST.
  # Until 2026-09-23 these were four separate 3-OS jobs (interop-test, onnxruntime-interop-test,
  # mlnet-interop-test, package-consumer-smoke). Building is itself part of the gate: this is the
  # ONLY place CI compiles the pythonnet, OnnxRuntime and MLNet packages, whose sources reach into
  # NumSharp.Core internals through keyed friend grants and would otherwise break unnoticed.
  #
  # Why one job:
  #   - Slots. The SciSharp org is on the GitHub Free plan: 5 concurrent macOS jobs ORG-WIDE. This
  #     workflow used to take all five per push (in run 35858283137 a macOS job waited 68 s for the
  #     slot the previous run's `test (macos-latest)` still held); it now takes two.
  #   - Nothing collides. The ORT and ML.NET suites are pure .NET — no Python, and no native asset
  #     beyond what their NuGet packages restore — so this job's Python setup is invisible to them,
  #     and the job env below is inert for them. The Python version pressure that DOES exist lives
  #     inside the pythonnet suite and is handled by the two Python environments, not by runners.
  #   - Wall time. The suites' measured costs (run 35858283137) add to ~10-13 min here, still under
  #     `test`'s 11.5-15.7 min, so the run gets no longer; NumSharp.Core compiles once, not four times.
  #
  # Independence — what separate jobs gave for free. A job stops at its first failing step, which
  # would let one suite's red hide every later suite's verdict. So each suite's steps carry an
  # explicit `if:` of `!cancelled()` plus "this suite's own prerequisite steps succeeded" (their step
  # ids), and every suite reports on its own; the job is red if any suite is. A cancelled run still
  # stops them (always() would not).
  #
  # Python environments (test/NumSharp.Tests.Interop/python-envs/make_env.py — stdlib venv + pip,
  # built from pinned, tracked requirement files; run the same script locally):
  #   - parity:    numpy ONLY, at the release whose bundled OpenBLAS NumSharp ships (the OpenBLAS
  #                manifest's numpy_version). Every test EXCEPT the [PythonEcosystem] ones runs here —
  #                the byte-exact live-NumPy oracle, in a process no third-party native runtime touches.
  #   - ecosystem: the same numpy + torch (CPU), pandas, scipy, pyarrow, pillow, polars, opencv. Only
  #                the [PythonEcosystem] tests run here; before this split CI installed numpy alone and
  #                those ~94 tests reported Inconclusive on every run.
  #   Two environments, not one, because the two groups want different things from numpy's
  #   neighbourhood: the oracle needs numpy pinned and nothing loaded beside it; the bridge tests need
  #   libraries that release on their own schedule and pin numpy ranges of their own. make_env.py
  #   installs every environment under a numpy constraint, so a library that demands another numpy
  #   FAILS the ecosystem install instead of silently moving the oracle. The collision is not
  #   hypothetical: onnxruntime==1.16.0 — the Python twin of the ORT floor below — publishes no
  #   cp312 wheel and was compiled against NumPy 1.x ("A module that was compiled using NumPy 1.x
  #   cannot be run in NumPy 2.4.2"), so a Python that needs it must be a different interpreter.
  #   make_env.py builds each environment per interpreter (.venvs/<name>-py<maj><min>), so one
  #   machine holds several side by side; the .NET suites here need none of them.
  #   PythonSession embeds the environment named by NUMSHARP_PYTHONNET_PYTHON — binding (never falls
  #   back to another Python) and venv-aware (the venv's site-packages, not its base install's; the
  #   embedded sys.prefix is verified). The "Report Python host" step prints what it reads.
  interop-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    # This job installs Python + numpy below, so the engine MUST start here. Requiring the engine is
    # now PythonSession's DEFAULT (an absent engine hard-fails instead of skipping), so this line is
    # explicit belt-and-suspenders — it also guards against an ambient NUMSHARP_PYTHONNET_REQUIRE_ENGINE=0
    # from the runner environment silently re-enabling the green-by-skipping failure mode.
    env:
      NUMSHARP_PYTHONNET_REQUIRE_ENGINE: '1'
      # Pins the live-NumPy oracle's CPU dispatch below AVX-512 on the Linux leg ONLY. The byte-exact
      # tests hold NumPy to its reference configuration, the win-amd64 wheel on an AVX2 host, and the
      # Linux x86-64 wheel leaves that configuration on an AVX-512 runner. Its meson build links Intel
      # SVML (use_svml = linux AND x86_64 AND X86_V4), so on AVX512_SKX hardware float64 exp/log
      # (__svml_exp8_ha/__svml_log8_ha) and ~20 other f32/f64 ufuncs (power, arccos, tan, cbrt, ...)
      # stop calling the libm that NumSharp's .NET Math also calls. The AVX512F float32 exp/log
      # instantiations take over from the AVX2-FMA3 ones NumSharp ports too.
      # Evidence: run 35828348090's ubuntu leg drew a runner whose numpy.show_config() found
      # X86_V3+X86_V4+AVX512_ICL and failed 18 byte-exact tests NO commit touched (GoogLeNet LRN,
      # Walk slerp, LSTM/RNN/MicroGpt/Pong training); run 35824898562's ubuntu leg found only X86_V3
      # and passed all of them. The runner hardware is not ours to choose, so the pin makes the answer
      # independent of it. NumPy's runtime override: disabling a feature the CPU lacks is a silent
      # no-op, so AVX2 runners are unaffected, and an empty value counts as unset.
      # Not needed elsewhere: the Windows wheel has no AVX-512 dispatch at all (meson_cpu disables X86_V4
      # and AVX512_ICL under MSVC), and on the macOS arm64 wheel these names do not exist. Set the same
      # variable to run this suite on an AVX-512 Linux box. The step "Install numpy" prints
      # show_config(), whose "found" list reflects the pin.
      NPY_DISABLE_CPU_FEATURES: ${{ matrix.os == 'ubuntu-latest' && 'X86_V4 AVX512_ICL AVX512_SPR' || '' }}
      # Both variables above are inert for the ONNX Runtime, ML.NET and "Package consumer:" steps:
      # those suites and scratch consumers never start pythonnet or import numpy. NEVER add
      # NUMSHARP_OPENBLAS_CACHE_DIR to this block: verify_build_override.sh asserts the package's
      # DEFAULT per-user cache root on Linux/macOS (~/.cache/NumSharp/openblas) and, unlike
      # verify_package_consumer.sh, does not unset the variable — a job-level value would fail its
      # step 1 on two of the three legs. Nor NUMSHARP_PYTHONNET_PYTHON: which Python environment a
      # pythonnet run embeds is a per-STEP choice (parity vs ecosystem), set on each test step.

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    # The BASE interpreter the Python environments are built from (make_env.py builds from the
    # interpreter that runs it). 3.12 sits inside pythonnet 3.0.5's range (PythonSession rejects
    # anything outside 3.7-3.13) and numpy 2.4.2's (cp311+). "Stage OpenBLAS" and the "Package
    # consumer:" steps use it directly — they are stdlib-only (fetch_openblas.py, the nupkg listing,
    # the macOS realpath compares). The pip cache is keyed on exactly the files that decide what the
    # environments hold (the requirement files + the numpy pin in the OpenBLAS manifest), so torch's
    # ~200 MB CPU wheel downloads once per key rather than on every run; every venv's pip reads the
    # same per-user cache.
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          test/NumSharp.Tests.Interop/python-envs/*.txt
          src/NumSharp.Interop.OpenBLAS/tools/openblas-manifest.json

    # The byte-exact live-NumPy oracle's environment. make_env.py installs numpy at the OpenBLAS
    # manifest's numpy_version (NumSharp bundles the scipy-openblas build that release pins, so both
    # sides call the identical binary — a newer numpy ships a different build and every *_ByteExact
    # test reds), forces the scipy-openblas wheel on macOS (numpy's macosx_14_0 wheels link Apple
    # Accelerate, which pip prefers on a macOS 14+ runner), and then VERIFIES what numpy reports: the
    # pinned release linked to scipy-openblas at the manifest's openblas_version, or the step fails.
    # stdout is exactly the environment's interpreter path; the test steps read it from this output.
    - name: "Python env: parity (numpy only)"
      id: pyenv_parity
      shell: bash
      run: |
        PY=$(python test/NumSharp.Tests.Interop/python-envs/make_env.py parity)
        echo "python=$PY" >> "$GITHUB_OUTPUT"

    # The third-party libraries the [PythonEcosystem] tests bridge into, on top of the same pinned and
    # verified numpy (make_env.py holds it with a constraint, so no library can move it). torch comes
    # from PyTorch's CPU-only index (python-envs/torch-cpu.txt): PyPI's Linux wheel would drag ~3 GB of
    # CUDA libraries onto a GPU-less runner. `!cancelled()`: a failed parity build must not stop this
    # one, and vice versa — the test steps key on each environment's own outcome.
    - name: "Python env: ecosystem (numpy + torch, pandas, scipy, pyarrow, pillow, polars, opencv)"
      id: pyenv_ecosystem
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        PY=$(python test/NumSharp.Tests.Interop/python-envs/make_env.py ecosystem)
        echo "python=$PY" >> "$GITHUB_OUTPUT"

    # Prints, per environment, exactly what PythonSession's probe reads (base_prefix / INSTSONAME /
    # LIBDIR locate libpython; prefix vs base_prefix decides venv adoption; executable is what it
    # embeds through), numpy's BLAS, and the runner's vector ISA next to NumPy's EFFECTIVE dispatch —
    # so a red or skipped interop test is diagnosable from the log without reproducing locally.
    # Hosted runners are a mix of AVX2-only and AVX-512 machines, and on Linux NumPy's float answers
    # change with that (see NPY_DISABLE_CPU_FEATURES above): the raw per-instruction flags (AVX512F)
    # survive the pin, the dispatch groups (X86_V4, AVX512_ICL) do not, so "AVX512F=True ...
    # X86_V4=False" is the pin at work. Same private module numpy.show_config() itself reads.
    - name: Report Python host
      if: ${{ !cancelled() }}
      shell: bash
      env:
        PARITY_PYTHON: ${{ steps.pyenv_parity.outputs.python }}
        ECOSYSTEM_PYTHON: ${{ steps.pyenv_ecosystem.outputs.python }}
      run: |
        for PY in "$PARITY_PYTHON" "$ECOSYSTEM_PYTHON"; do
          [ -n "$PY" ] || continue   # an environment whose build failed has no interpreter to report
          echo "=== $PY"
          "$PY" - <<'PYEOF'
        import sys, sysconfig, numpy
        from numpy._core._multiarray_umath import __cpu_features__ as f
        blas = numpy.show_config(mode='dicts')['Build Dependencies']['blas']
        print('python      ', sys.version.replace('\n', ' '))
        print('numpy       ', numpy.__version__, '|', blas.get('name'), blas.get('version'))
        print('prefix      ', sys.prefix)
        print('base_prefix ', sys.base_prefix)
        print('executable  ', sys.executable)
        print('INSTSONAME  ', sysconfig.get_config_var('INSTSONAME'))
        print('LIBDIR      ', sysconfig.get_config_var('LIBDIR'))
        print('cpu         ', 'AVX512F=%s AVX2=%s ASIMD=%s | numpy dispatch X86_V4=%s AVX512_ICL=%s'
              % tuple(f.get(k) for k in ('AVX512F', 'AVX2', 'ASIMD', 'X86_V4', 'AVX512_ICL')))
        PYEOF
        done

    # The bundled OpenBLAS binaries are gitignored, so a clean checkout has none. This suite runs
    # with OpenBLAS as its DEFAULT backend (PythonSession.Start calls OpenBlasEngine.TryEnable), and
    # the Backend_IsOpenBlas* tests hard-assert OpenBlasEngine.Enabled. Stage the pinned per-RID
    # assets before the build so the current RID's native library is copied into the test output.
    # (fetch_openblas.py is stdlib-only; Python is already set up above.)
    - name: Stage OpenBLAS native assets
      id: stage_openblas
      if: ${{ !cancelled() }}
      run: python src/NumSharp.Interop.OpenBLAS/tools/fetch_openblas.py

    - name: "pythonnet: Build"
      id: pythonnet_build
      if: ${{ !cancelled() && steps.stage_openblas.outcome == 'success' }}
      run: dotnet build test/NumSharp.Tests.Interop/NumSharp.Tests.Interop.csproj --configuration Release -p:NoWarn=${{ env.DOTNET_NOWARN }}

    # The current-RID OpenBLAS native flows to the test output as CopyToOutputDirectory content
    # across the ProjectReference — but on a clean runner it can be missing (RID-specific runtime
    # assets don't always flow to a portable, no-RID build). Copy the staged runtimes into the test
    # output as a self-heal, and log both what landed AND the .so's dynamic deps, so a genuine
    # load failure (a missing libgfortran/libquadmath) is visible rather than a silent Enabled=false.
    - name: Ensure + diagnose OpenBLAS native in test output
      if: ${{ !cancelled() && steps.pythonnet_build.outcome == 'success' }}
      shell: bash
      run: |
        for tfm in net8.0 net10.0; do
          out="test/NumSharp.Tests.Interop/bin/Release/$tfm"
          mkdir -p "$out/runtimes"
          cp -r src/NumSharp.Interop.OpenBLAS/runtimes/* "$out/runtimes/" 2>/dev/null || true
          echo "=== $out native assets ==="
          find "$out" -path "*native*" \( -name "*openblas*" -o -name "*scipy*" \) 2>/dev/null || echo "  (none — content did not flow)"
        done
        so=$(find src/NumSharp.Interop.OpenBLAS/runtimes -name "*openblas*.so" 2>/dev/null | head -1)
        if [ -n "$so" ] && command -v ldd >/dev/null 2>&1; then
          echo "=== ldd $so ==="; ldd "$so" 2>&1 | grep -i "not found" || echo "  (all deps resolved)"
        fi

    # The suite runs once per Python environment, split by the PythonEcosystem category (the suite
    # carries no OpenBugs/HighMemory tests, and every test already self-asserts a LiveExports/
    # LiveImports leak baseline). Every test runs exactly once per TFM:
    #   - parity:    everything EXCEPT [PythonEcosystem] — the byte-exact live-NumPy oracle.
    #   - ecosystem: ONLY [PythonEcosystem], with NUMSHARP_PYTHONNET_REQUIRE_PACKAGES=1 so an absent
    #                or wrong-version package FAILS instead of skipping (the environment installs every
    #                one on purpose). A package-gated test that forgot its tag fails in either run —
    #                the gates enforce it — so none can slip into the numpy-only run and skip forever.
    # NUMSHARP_PYTHONNET_PYTHON names the environment's interpreter; PythonSession treats it as binding
    # and embeds the venv itself (its site-packages, verified through the embedded sys.prefix).
    - name: "pythonnet: Test parity (net8.0)"
      if: ${{ !cancelled() && steps.pythonnet_build.outcome == 'success' && steps.pyenv_parity.outcome == 'success' }}
      timeout-minutes: 10
      shell: bash
      env:
        NUMSHARP_PYTHONNET_PYTHON: ${{ steps.pyenv_parity.outputs.python }}
      run: |
        dotnet test test/NumSharp.Tests.Interop/NumSharp.Tests.Interop.csproj \
          --configuration Release --no-build --framework net8.0 \
          --filter "TestCategory!=PythonEcosystem" --logger "trx;LogFileName=pythonnet-parity-net8.0.trx"

    - name: "pythonnet: Test parity (net10.0)"
      if: ${{ !cancelled() && steps.pythonnet_build.outcome == 'success' && steps.pyenv_parity.outcome == 'success' }}
      timeout-minutes: 10
      shell: bash
      env:
        NUMSHARP_PYTHONNET_PYTHON: ${{ steps.pyenv_parity.outputs.python }}
      run: |
        dotnet test test/NumSharp.Tests.Interop/NumSharp.Tests.Interop.csproj \
          --configuration Release --no-build --framework net10.0 \
          --filter "TestCategory!=PythonEcosystem" --logger "trx;LogFileName=pythonnet-parity-net10.0.trx"

    - name: "pythonnet: Test ecosystem (net8.0)"
      if: ${{ !cancelled() && steps.pythonnet_build.outcome == 'success' && steps.pyenv_ecosystem.outcome == 'success' }}
      timeout-minutes: 10
      shell: bash
      env:
        NUMSHARP_PYTHONNET_PYTHON: ${{ steps.pyenv_ecosystem.outputs.python }}
        NUMSHARP_PYTHONNET_REQUIRE_PACKAGES: '1'
      run: |
        dotnet test test/NumSharp.Tests.Interop/NumSharp.Tests.Interop.csproj \
          --configuration Release --no-build --framework net8.0 \
          --filter "TestCategory=PythonEcosystem" --logger "trx;LogFileName=pythonnet-ecosystem-net8.0.trx"

    - name: "pythonnet: Test ecosystem (net10.0)"
      if: ${{ !cancelled() && steps.pythonnet_build.outcome == 'success' && steps.pyenv_ecosystem.outcome == 'success' }}
      timeout-minutes: 10
      shell: bash
      env:
        NUMSHARP_PYTHONNET_PYTHON: ${{ steps.pyenv_ecosystem.outputs.python }}
        NUMSHARP_PYTHONNET_REQUIRE_PACKAGES: '1'
      run: |
        dotnet test test/NumSharp.Tests.Interop/NumSharp.Tests.Interop.csproj \
          --configuration Release --no-build --framework net10.0 \
          --filter "TestCategory=PythonEcosystem" --logger "trx;LogFileName=pythonnet-ecosystem-net10.0.trx"

    # ── ONNX Runtime interop (NumSharp.Interop.OnnxRuntime) ────────────────────────────────────────
    #
    # No Python, no GPU: the suite runs committed .onnx models (generated once by
    # test/oracle/gen_onnx_models.py) through the CPU execution provider the Microsoft.ML.OnnxRuntime
    # package brings for every runner RID. It runs against the package's FLOOR (1.16.0 — the ORT a bare
    # consumer resolves, and the version the package compiles against) on both TFMs, then against the
    # CURRENT release, so both ends of the dependency range are exercised. Its build needs nothing the
    # pythonnet suite set up, so it only waits for cancellation; NumSharp.Core is already built.
    - name: "ONNX Runtime: Build (floor)"
      id: ort_build
      if: ${{ !cancelled() }}
      run: dotnet build test/NumSharp.Tests.Interop.OnnxRuntime/NumSharp.Tests.Interop.OnnxRuntime.csproj --configuration Release -p:NoWarn=${{ env.DOTNET_NOWARN }}

    - name: "ONNX Runtime: Test floor (net8.0)"
      if: ${{ !cancelled() && steps.ort_build.outcome == 'success' }}
      timeout-minutes: 10
      shell: bash
      run: |
        dotnet test test/NumSharp.Tests.Interop.OnnxRuntime/NumSharp.Tests.Interop.OnnxRuntime.csproj \
          --configuration Release --no-build --framework net8.0 --logger "trx;LogFileName=onnxruntime-floor-net8.0.trx"

    - name: "ONNX Runtime: Test floor (net10.0)"
      if: ${{ !cancelled() && steps.ort_build.outcome == 'success' }}
      timeout-minutes: 10
      shell: bash
      run: |
        dotnet test test/NumSharp.Tests.Interop.OnnxRuntime/NumSharp.Tests.Interop.OnnxRuntime.csproj \
          --configuration Release --no-build --framework net10.0 --logger "trx;LogFileName=onnxruntime-floor-net10.0.trx"

    # The current ORT release. Keep the version in lockstep with the one the README's "Verified against"
    # banner names; bumping it here is the whole of "support a newer ORT". The -p: global property
    # changes the restore, so this run re-restores and rebuilds the suite IN PLACE (same obj/bin — the
    # test csproj does not redirect them) against that version; it runs after both floor steps, which
    # have already consumed the floor build.
    - name: "ONNX Runtime: Test current (net10.0)"
      if: ${{ !cancelled() && steps.ort_build.outcome == 'success' }}
      timeout-minutes: 15
      shell: bash
      run: |
        dotnet test test/NumSharp.Tests.Interop.OnnxRuntime/NumSharp.Tests.Interop.OnnxRuntime.csproj \
          --configuration Release --framework net10.0 --logger "trx;LogFileName=onnxruntime-current-net10.0.trx" \
          -p:OnnxRuntimeVersion=1.29.0 -p:NoWarn=${{ env.DOTNET_NOWARN }}

    # ── ML.NET interop (NumSharp.Interop.MLNet) ────────────────────────────────────────────────────
    #
    # No Python, no GPU: the suite feeds NDArray-backed IDataViews through real Microsoft.ML transforms
    # and trainers (NormalizeMinMax, Concatenate, Sdca) — all pure managed. It runs against the
    # package's FLOOR (Microsoft.ML 2.0.1, which carries Microsoft.ML.DataView 2.0.0 — the DataView a
    # bare consumer resolves, and the version the package compiles against) on both TFMs, then against
    # the CURRENT release. Independent of every suite above, like the ORT one.
    - name: "ML.NET: Build (floor)"
      id: mlnet_build
      if: ${{ !cancelled() }}
      run: dotnet build test/NumSharp.Tests.Interop.MLNet/NumSharp.Tests.Interop.MLNet.csproj --configuration Release -p:NoWarn=${{ env.DOTNET_NOWARN }}

    - name: "ML.NET: Test floor (net8.0)"
      if: ${{ !cancelled() && steps.mlnet_build.outcome == 'success' }}
      timeout-minutes: 10
      shell: bash
      run: |
        dotnet test test/NumSharp.Tests.Interop.MLNet/NumSharp.Tests.Interop.MLNet.csproj \
          --configuration Release --no-build --framework net8.0 --logger "trx;LogFileName=mlnet-floor-net8.0.trx"

    - name: "ML.NET: Test floor (net10.0)"
      if: ${{ !cancelled() && steps.mlnet_build.outcome == 'success' }}
      timeout-minutes: 10
      shell: bash
      run: |
        dotnet test test/NumSharp.Tests.Interop.MLNet/NumSharp.Tests.Interop.MLNet.csproj \
          --configuration Release --no-build --framework net10.0 --logger "trx;LogFileName=mlnet-floor-net10.0.trx"

    # The current ML.NET release. Keep the version in lockstep with the one the README's "Verified
    # against" banner names; bumping it here is the whole of "support a newer ML.NET". Rebuilds the
    # suite in place against that version, like the ORT "current" step above.
    - name: "ML.NET: Test current (net10.0)"
      if: ${{ !cancelled() && steps.mlnet_build.outcome == 'success' }}
      timeout-minutes: 15
      shell: bash
      run: |
        dotnet test test/NumSharp.Tests.Interop.MLNet/NumSharp.Tests.Interop.MLNet.csproj \
          --configuration Release --framework net10.0 --logger "trx;LogFileName=mlnet-current-net10.0.trx" \
          -p:MLNetVersion=4.0.2 -p:NoWarn=${{ env.DOTNET_NOWARN }}

    # ── Package consumer: the nupkg-CONSUMER gate for NumSharp.Interop.OpenBLAS ──────────────────
    #
    # Every other suite consumes the package by ProjectReference, where a Content item copies files
    # a PackageReference restore never sees — which is exactly how the macOS package shipped a
    # dylib whose vendored Fortran runtime sat in a folder NuGet silently drops ("Library not
    # loaded" on every Mac, green CI). These steps pack the REAL nupkg into a local feed, restore
    # it into a scratch consumer by PackageReference, and prove the bundled OpenBLAS LOADS in
    # every layout a consumer can end up with: the portable runtimes/ tree, a read-only install,
    # and a RID-specific (flattened) publish. macOS is the one that matters; Linux and Windows
    # run the same script so a layout regression on any RID is caught by the PR that causes it.
    #
    # Why these steps come LAST, and why they carry `!cancelled()`:
    #   - AFTER every test suite above, because both scripts change the machine: they `-t:Rebuild`
    #     Core and NumSharp.Interop.OpenBLAS in Release inside the repo tree, and delete this version
    #     of NumSharp / NumSharp.Interop.OpenBLAS from the global NuGet packages folder so the
    #     scratch consumer restores the fresh pack. Running last keeps every suite on the untouched
    #     build it had while each still owned a runner.
    #   - `!cancelled()` keeps each script's verdict independent of the steps before it, as a
    #     separate job's was: a red suite must not hide a package-layout regression, and the
    #     build-override script still runs when the consumer script failed. A cancelled run still
    #     stops them (always() would not).
    #   - Neither uses this job's Build — each packs from its own Release rebuild. They rely only on
    #     Python (above) and on the bundle staged by "Stage OpenBLAS native assets":
    #     verify_build_override.sh packs WITHOUT RequireOpenBlasAssets, so an unstaged tree would
    #     reach its first check as "bundled asset did not reach the output", not as a staging error.
    #   - timeout-minutes: a normal run takes 1.5-2.5 min per script, PyPI downloads included; the
    #     cap only keeps a hung download from holding the runner for the 6-hour job default.
    - name: "Package consumer: pack, restore by PackageReference, load in every layout"
      if: ${{ !cancelled() }}
      timeout-minutes: 15
      shell: bash
      run: bash src/NumSharp.Interop.OpenBLAS/tools/verify_package_consumer.sh

    # The build-time version-override gate (15 steps; PyPI once, then the per-user cache). Before
    # 01596628 it ran nowhere in CI; it belongs here because the override task co-extracts the
    # vendored Fortran runtime into its cache entry and stages it beside the override — a
    # Linux/macOS-only branch a Windows developer box cannot exercise (the Windows DLL is
    # self-contained). It writes the REAL per-user build cache — poisoning the scipy-openblas64/
    # entry on purpose in its step 10, then proving the self-heal. Nothing else in this job reads
    # that subtree: the interop build sets no override, and the macOS loader's relocation copies
    # live under the same root's separate dyld/ folder.
    - name: "Package consumer: build-time version override, end to end"
      if: ${{ !cancelled() }}
      timeout-minutes: 15
      shell: bash
      run: bash src/NumSharp.Interop.OpenBLAS/tools/verify_build_override.sh

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: interop-test-results-${{ matrix.os }}
        path: ${{ github.workspace }}/**/TestResults/**/*.trx
        retention-days: 5

  validate-release:
    # Interop now ships as packages, so a broken bridge must block the release — and so must a
    # package that restores but cannot load its own bundled binary. interop-test gates all of it:
    # the pythonnet, ONNX Runtime and ML.NET suites and the "Package consumer:" steps (formerly the
    # onnxruntime-interop-test, mlnet-interop-test and package-consumer-smoke jobs), so needing it
    # covers every interop package.
    needs: [test, interop-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      is_valid: ${{ steps.check.outputs.is_valid }}
      version: ${{ steps.check.outputs.version }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Verify tag is on master branch
      id: check
      run: |
        TAG_COMMIT=$(git rev-parse HEAD)
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

        # Check if the tagged commit is reachable from origin/master
        if git merge-base --is-ancestor "$TAG_COMMIT" origin/master; then
          echo "Tag v$VERSION is on master branch"
          echo "is_valid=true" >> $GITHUB_OUTPUT
        else
          echo "::error::Tag v$VERSION is NOT on master branch. Releases must be tagged from master."
          echo "is_valid=false" >> $GITHUB_OUTPUT
          exit 1
        fi

  build-nuget:
    needs: validate-release
    if: needs.validate-release.outputs.is_valid == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Setup Python (for OpenBLAS native-asset staging)
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    # NumSharp.Interop.OpenBLAS bundles the prebuilt OpenBLAS binaries NumPy pins as per-RID runtime
    # assets. They are gitignored, so a clean release checkout has none — fetch_openblas.py downloads
    # all 8 RIDs from PyPI and verifies two sha256s each against the checked-in manifest (pure stdlib,
    # no pip needed). RequireOpenBlasAssets=true at build/pack (below) then makes a missing asset a
    # hard error, so the package can never publish as an empty managed shell.
    - name: Stage OpenBLAS native assets
      run: python src/NumSharp.Interop.OpenBLAS/tools/fetch_openblas.py

    # ONE version property. The repo derives every other number from it (Directory.Build.props
    # VersionPrefix + the SDK's GenerateAssemblyInfo/NuGet pack targets): PackageVersion = Version,
    # AssemblyVersion = FileVersion = Version minus the pre-release tag (0.70.0-rc.1 → 0.70.0.0),
    # InformationalVersion = Version+<commit>. Passing AssemblyVersion / FileVersion / PackageVersion
    # separately, as this job once did, only created a second place for them to disagree.
    #
    # SourceRevisionId is the FULL commit SHA. The SDK's built-in SourceLink derives exactly that
    # from git, and NuGet copies it verbatim into the nuspec <repository commit="…"> (which
    # nuget.org links to and SourceLink resolves sources through) — a 7-char abbreviation here
    # would have overridden a correct value with a short one. ContinuousIntegrationBuild=true maps
    # the pdb source paths onto the deterministic /_/ root; release binaries ONLY, because a test
    # locates repo files through [CallerFilePath] and needs real paths in the test jobs.
    - name: Get version info
      id: version
      shell: bash
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version $VERSION @ $GITHUB_SHA"

    - name: Build
      run: |
        # -t:Rebuild (NOT incremental): every shipping project now emits XML docs
        # (GenerateDocumentationFile), and the Pack steps below run --no-build. An incremental
        # build can declare a stale target-framework up-to-date and skip CoreCompile, leaving no
        # .xml on disk — pack then fails NU5026, or (worse) packs stale output. Rebuild forces a
        # clean compile of every TFM so --no-build always packs a complete, current tree. This is
        # the repo convention for anything that gets packed (see .claude/CLAUDE.md / OpenBLAS design).
        dotnet build src/NumSharp.Core/NumSharp.Core.csproj \
          --configuration Release \
          -t:Rebuild \
          -p:NoWarn=${{ env.DOTNET_NOWARN }} \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          -p:SourceRevisionId=${{ github.sha }} \
          -p:ContinuousIntegrationBuild=true

        dotnet build src/NumSharp.Bitmap/NumSharp.Bitmap.csproj \
          --configuration Release \
          -t:Rebuild \
          -p:NoWarn=${{ env.DOTNET_NOWARN }} \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          -p:SourceRevisionId=${{ github.sha }} \
          -p:ContinuousIntegrationBuild=true

        # Interop packs its NumSharp.Core ProjectReference as a NuGet dependency
        # on "NumSharp" $(Version), so the same -p:Version keeps the two in lockstep
        # (the Directory.Build.props VersionPrefix is only the local-dev default).
        dotnet build src/NumSharp.Interop.pythonnet/NumSharp.Interop.pythonnet.csproj \
          --configuration Release \
          -t:Rebuild \
          -p:NoWarn=${{ env.DOTNET_NOWARN }} \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          -p:SourceRevisionId=${{ github.sha }} \
          -p:ContinuousIntegrationBuild=true

        # OpenBLAS: native assets were staged above. Whether they are present is checked at PACK
        # time (RequireOpenBlasAssets=true on the Pack step below turns a missing bundle into a
        # hard error); nothing packs during the build.
        dotnet build src/NumSharp.Interop.OpenBLAS/NumSharp.Interop.OpenBLAS.csproj \
          --configuration Release \
          -t:Rebuild \
          -p:NoWarn=${{ env.DOTNET_NOWARN }} \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          -p:SourceRevisionId=${{ github.sha }} \
          -p:ContinuousIntegrationBuild=true

        # ONNX Runtime interop: managed-only (depends on Microsoft.ML.OnnxRuntime.Managed, no native
        # asset of its own), so a plain Rebuild is the whole build.
        dotnet build src/NumSharp.Interop.OnnxRuntime/NumSharp.Interop.OnnxRuntime.csproj \
          --configuration Release \
          -t:Rebuild \
          -p:NoWarn=${{ env.DOTNET_NOWARN }} \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          -p:SourceRevisionId=${{ github.sha }} \
          -p:ContinuousIntegrationBuild=true

        # ML.NET interop: managed-only (depends on Microsoft.ML.DataView, no native asset of its own),
        # so a plain Rebuild is the whole build.
        dotnet build src/NumSharp.Interop.MLNet/NumSharp.Interop.MLNet.csproj \
          --configuration Release \
          -t:Rebuild \
          -p:NoWarn=${{ env.DOTNET_NOWARN }} \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          -p:SourceRevisionId=${{ github.sha }} \
          -p:ContinuousIntegrationBuild=true

        # The weaver: a tools-only build-time package (no lib/, no dependencies — see
        # tools/verify_build_package.sh). Its pack target publishes the tool into tools/,
        # which under --no-build below stages the outputs this Rebuild produced.
        dotnet build tools/NumSharp.Build/NumSharp.Build.csproj \
          --configuration Release \
          -t:Rebuild \
          -p:NoWarn=${{ env.DOTNET_NOWARN }} \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          -p:SourceRevisionId=${{ github.sha }} \
          -p:ContinuousIntegrationBuild=true

    - name: Pack
      run: |
        mkdir -p artifacts/nuget

        dotnet pack src/NumSharp.Core/NumSharp.Core.csproj \
          --configuration Release \
          --no-build \
          --output artifacts/nuget \
          -p:NoWarn=${{ env.DOTNET_NOWARN }} \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          -p:SourceRevisionId=${{ github.sha }} \
          -p:ContinuousIntegrationBuild=true

        dotnet pack src/NumSharp.Bitmap/NumSharp.Bitmap.csproj \
          --configuration Release \
          --no-build \
          --output artifacts/nuget \
          -p:NoWarn=${{ env.DOTNET_NOWARN }} \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          -p:SourceRevisionId=${{ github.sha }} \
          -p:ContinuousIntegrationBuild=true

        dotnet pack src/NumSharp.Interop.pythonnet/NumSharp.Interop.pythonnet.csproj \
          --configuration Release \
          --no-build \
          --output artifacts/nuget \
          -p:NoWarn=${{ env.DOTNET_NOWARN }} \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          -p:SourceRevisionId=${{ github.sha }} \
          -p:ContinuousIntegrationBuild=true

        dotnet pack src/NumSharp.Interop.OnnxRuntime/NumSharp.Interop.OnnxRuntime.csproj \
          --configuration Release \
          --no-build \
          --output artifacts/nuget \
          -p:NoWarn=${{ env.DOTNET_NOWARN }} \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          -p:SourceRevisionId=${{ github.sha }} \
          -p:ContinuousIntegrationBuild=true

        dotnet pack src/NumSharp.Interop.MLNet/NumSharp.Interop.MLNet.csproj \
          --configuration Release \
          --no-build \
          --output artifacts/nuget \
          -p:NoWarn=${{ env.DOTNET_NOWARN }} \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          -p:SourceRevisionId=${{ github.sha }} \
          -p:ContinuousIntegrationBuild=true

        dotnet pack src/NumSharp.Interop.OpenBLAS/NumSharp.Interop.OpenBLAS.csproj \
          --configuration Release \
          --no-build \
          --output artifacts/nuget \
          -p:NoWarn=${{ env.DOTNET_NOWARN }} \
          -p:RequireOpenBlasAssets=true \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          -p:SourceRevisionId=${{ github.sha }} \
          -p:ContinuousIntegrationBuild=true

        dotnet pack tools/NumSharp.Build/NumSharp.Build.csproj \
          --configuration Release \
          --no-build \
          --output artifacts/nuget \
          -p:NoWarn=${{ env.DOTNET_NOWARN }} \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          -p:SourceRevisionId=${{ github.sha }} \
          -p:ContinuousIntegrationBuild=true

        echo "Packages built:"
        ls -la artifacts/nuget/

    # Last gate before the artifact leaves the machine. Asserts every managed assembly inside every
    # packed .nupkg carries NumSharp's public key AND a real signature (not delay-signed), and fails
    # rather than passing vacuously if pack produced nothing. This is the check whose absence let six
    # years of releases ship with PublicKeyToken=null.
    - name: Verify strong naming of packed assemblies
      run: dotnet run .github/scripts/verify_strong_name.cs -- artifacts/nuget

    - name: Upload NuGet Packages
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: artifacts/nuget/*.nupkg
        retention-days: 5

  create-release:
    needs: [validate-release, build-nuget]
    if: needs.validate-release.outputs.is_valid == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Extract version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Download NuGet Packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: artifacts

    - name: Generate checksums
      run: |
        cd artifacts
        for f in *.nupkg; do
          sha256sum "$f" | cut -d' ' -f1 > "${f}.sha256"
          echo "${f}: $(cat ${f}.sha256)"
        done

    - name: Check if prerelease
      id: prerelease
      run: |
        if [[ "${{ steps.version.outputs.VERSION }}" == *"-"* ]]; then
          echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
        else
          echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
        fi

    - name: Compose release notes
      id: notes
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        NOTES_FILE="docs/releases/RELEASE_${VERSION}.md"
        {
          echo "## NumSharp v${VERSION}"
          echo ""
          echo "### Install via NuGet"
          echo ""
          echo '```'
          echo "dotnet add package NumSharp --version ${VERSION}"
          echo "dotnet add package NumSharp.Bitmap --version ${VERSION}"
          echo "dotnet add package NumSharp.Interop.pythonnet --version ${VERSION}"
          echo "dotnet add package NumSharp.Interop.OpenBLAS --version ${VERSION}"
          echo "dotnet add package NumSharp.Interop.OnnxRuntime --version ${VERSION}"
          echo "dotnet add package NumSharp.Interop.MLNet --version ${VERSION}"
          echo "dotnet add package NumSharp.Build --version ${VERSION}"
          echo '```'
          echo ""
          echo "### Packages"
          echo ""
          echo "| Package | NuGet |"
          echo "|---------|-------|"
          echo "| NumSharp | [![NuGet](https://img.shields.io/nuget/v/NumSharp.svg)](https://www.nuget.org/packages/NumSharp/${VERSION}) |"
          echo "| NumSharp.Bitmap | [![NuGet](https://img.shields.io/nuget/v/NumSharp.Bitmap.svg)](https://www.nuget.org/packages/NumSharp.Bitmap/${VERSION}) |"
          echo "| NumSharp.Interop.pythonnet | [![NuGet](https://img.shields.io/nuget/v/NumSharp.Interop.pythonnet.svg)](https://www.nuget.org/packages/NumSharp.Interop.pythonnet/${VERSION}) |"
          echo "| NumSharp.Interop.OpenBLAS | [![NuGet](https://img.shields.io/nuget/v/NumSharp.Interop.OpenBLAS.svg)](https://www.nuget.org/packages/NumSharp.Interop.OpenBLAS/${VERSION}) |"
          echo "| NumSharp.Interop.OnnxRuntime | [![NuGet](https://img.shields.io/nuget/v/NumSharp.Interop.OnnxRuntime.svg)](https://www.nuget.org/packages/NumSharp.Interop.OnnxRuntime/${VERSION}) |"
          echo "| NumSharp.Interop.MLNet | [![NuGet](https://img.shields.io/nuget/v/NumSharp.Interop.MLNet.svg)](https://www.nuget.org/packages/NumSharp.Interop.MLNet/${VERSION}) |"
          echo "| NumSharp.Build | [![NuGet](https://img.shields.io/nuget/v/NumSharp.Build.svg)](https://www.nuget.org/packages/NumSharp.Build/${VERSION}) |"
        } > RELEASE_BODY.md
        if [ -f "$NOTES_FILE" ]; then
          { echo ""; echo "---"; echo ""; cat "$NOTES_FILE"; } >> RELEASE_BODY.md
          echo "HAS_NOTES=true" >> "$GITHUB_OUTPUT"
        else
          echo "HAS_NOTES=false" >> "$GITHUB_OUTPUT"
        fi
        echo "Composed RELEASE_BODY.md ($(wc -l < RELEASE_BODY.md) lines); notes file present: $([ -f "$NOTES_FILE" ] && echo yes || echo no)"

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          artifacts/*.nupkg
          artifacts/*.sha256
        draft: false
        prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE }}
        generate_release_notes: ${{ steps.notes.outputs.HAS_NOTES != 'true' }}
        body_path: RELEASE_BODY.md

  publish-nuget:
    needs: [validate-release, build-nuget]
    if: needs.validate-release.outputs.is_valid == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Download NuGet Packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: artifacts

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Push to NuGet
      run: |
        for package in artifacts/*.nupkg; do
          echo "Pushing $package..."
          dotnet nuget push "$package" \
            --api-key ${{ secrets.NUGETAPIKEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        done
